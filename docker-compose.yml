services:
  postgres:
    image: postgres:16-alpine
    container_name: mestra-nyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mestra-nyx-network

  # Redis - Cache e sessões
  redis:
    image: redis:7-alpine
    container_name: mestra-nyx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mestra-nyx-network

  # Adminer - Interface web para PostgreSQL
  adminer:
    image: adminer:latest
    container_name: mestra-nyx-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mestra-nyx-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  mestra-nyx-network:
    driver: bridge
